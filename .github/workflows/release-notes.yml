name: Release Notes

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths-ignore:
      - .release-notes/next-release.md
      - .release-notes/\d+.\d+.\d+.md

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    name: Update release notes
    steps:
      - name: Update
        uses: docker://ponylang/release-notes-bot-action:0.3.3@sha256:9270852896855374ccf5ba656b85a5022c4757e35d476154976fd291d8e61ae9
        with:
          git_user_name: "Ponylang Main Bot"
          git_user_email: "ponylang.main@gmail.com"
        env:
          API_CREDENTIALS: ${{ secrets.GITHUB_TOKEN }}
