name: Test required inputs - credential check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-no-creds
        uses: .
        continue-on-error: true
        with:
          docs_build_dir: generated-docs
          git_user_email: docs-bot@example.org
          git_user_name: Docs Bot
          library_name: test-library
          site_url: https://docs.example.org/test-library
      - name: Assert action failed without credentials
        env:
          OUTCOME: ${{ steps.action-no-creds.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither DEPLOY_KEY nor RELEASE_TOKEN is set"
            exit 1
          fi
          echo "PASS: action correctly requires DEPLOY_KEY or RELEASE_TOKEN"
