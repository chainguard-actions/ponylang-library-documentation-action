name: Test missing token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without DEPLOY_KEY or RELEASE_TOKEN (expect failure)
        id: action
        uses: .
        with:
          docs_build_dir: docs
          git_user_email: test@example.com
          git_user_name: Test User
          library_name: mylib
          site_url: https://example.com
        continue-on-error: true

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when DEPLOY_KEY and RELEASE_TOKEN are both missing, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no token was provided"
