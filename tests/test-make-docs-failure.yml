name: Test make docs failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          docs_build_dir: build/docs
          git_user_email: test@example.com
          git_user_name: Test User
          library_name: mylib
          site_url: https://example.com/mylib
        env:
          RELEASE_TOKEN: fake-but-present-token
        # RELEASE_TOKEN is set so credentials check passes,
        # but there is no Makefile with a 'docs' target, so 'make docs' will fail

      - name: Assert action failed at make docs step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'make docs' has no target, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when 'make docs' target was missing"
