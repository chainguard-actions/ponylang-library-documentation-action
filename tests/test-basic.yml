name: Test basic usage - library documentation action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Pony library structure
        run: |
          mkdir -p docs
          cat > Makefile << 'EOF'
          docs:
          	mkdir -p docs
          	echo "# Test Library" > docs/index.md
          EOF
          echo "Makefile created"
          cat Makefile

      - id: action
        uses: .
        with:
          docs_build_dir: docs
          git_user_email: test@example.com
          git_user_name: Test User
          library_name: test-library
          site_url: https://example.com/test-library
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action runs a Docker container that tries to build docs
          # It may fail if the full Pony toolchain is not available,
          # but we verify it was invoked (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
