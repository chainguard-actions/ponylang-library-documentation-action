name: Test basic usage - missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          docs_build_dir: docs
          git_user_email: test@example.com
          git_user_name: Test User
          library_name: my-library
          site_url: https://example.com/my-library
      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when DEPLOY_KEY and RELEASE_TOKEN are not set"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials are missing"
