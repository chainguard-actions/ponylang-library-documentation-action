name: Test missing auth credentials
# Tests that the action exits with an error when neither DEPLOY_KEY nor
# RELEASE_TOKEN environment variable is set.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action without auth credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          library_name: "mylib"
          docs_build_dir: "/tmp/docs"
          site_url: "https://example.com"
          git_user_name: "Test User"
          git_user_email: "test@example.com"
        # Intentionally NOT setting DEPLOY_KEY or RELEASE_TOKEN

      - name: Assert action failed due to missing auth
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no auth credentials are set, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when auth credentials were missing"
