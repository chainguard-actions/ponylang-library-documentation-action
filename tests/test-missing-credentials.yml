name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          library_name: mylib
          docs_build_dir: docs
          site_url: https://example.com
          git_user_name: Test User
          git_user_email: test@example.com
        # Neither DEPLOY_KEY nor RELEASE_TOKEN is set, so the action should
        # exit with code 1 immediately.

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no credentials are provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when DEPLOY_KEY and RELEASE_TOKEN are both absent"
