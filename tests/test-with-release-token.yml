name: Test action with RELEASE_TOKEN credential
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Provide a fake token — action should pass credential check
          # and fail later at 'make docs' (no Pony build environment available)
          RELEASE_TOKEN: "fake-release-token-for-testing"
        with:
          docs_build_dir: docs
          git_user_email: test@example.com
          git_user_name: Test User
          library_name: mylib
          site_url: https://example.com/docs

      - name: Assert action failed at expected stage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because 'make docs' cannot run in this environment.
          # It should NOT fail due to missing credentials (RELEASE_TOKEN is set).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed at expected stage (make docs or later)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
